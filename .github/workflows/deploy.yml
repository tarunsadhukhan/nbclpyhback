name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # This label is what links the GHCR package to this repository.
          # Without it the package is standalone, and the repo-scoped
          # GITHUB_TOKEN can push but NOT pull it — the VPS then gets
          # "error from registry: denied" on docker compose pull.
          labels: |
            org.opencontainers.image.source=https://github.com/tarunsadhukhan/nbclpyhback
          tags: |
            ghcr.io/tarunsadhukhan/nbclerp3be:latest
            ghcr.io/tarunsadhukhan/nbclerp3be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/nbjcl/nbclerp3be

      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # set -e: without it a failed `docker compose pull` falls through to
            # `up -d`, which happily reports the OLD image as Running — the
            # deploy silently no-ops and only dies on the prune.
            set -e
            # The /tmp/nbclerp-deploy.lock flock that used to be here guarded
            # against nbclerp3ui's `docker image prune -f` deleting layers while
            # this job extracted them. Both repos shared one VPS then; they no
            # longer do (backend 45.58.59.64, frontend 45.58.59.71), so there is
            # nothing left to race against on this host.
            cd /opt/nbjcl/nbclerp3be
            docker network inspect nbclerp >/dev/null 2>&1 || docker network create nbclerp
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            # --remove-orphans: containers left behind by an older version of
            # this compose file (e.g. before container_name: was set) keep
            # running and keep holding host ports, which is what broke run #9.
            docker compose up -d --remove-orphans
            docker image prune -f
