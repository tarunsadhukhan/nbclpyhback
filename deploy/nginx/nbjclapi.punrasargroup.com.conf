# Backend VPS 45.58.59.64 -> /etc/nginx/sites-available/nbjclapi.punrasargroup.com.conf
#
# Proxies port 80 to the FastAPI container published on :8001
# (compose maps 8001:8000; uvicorn listens on 8000 inside the container).
#
# NOTE: the frontend does NOT come through here. Next.js rewrites /api/* to
# http://45.58.59.64:8001 server-side, hitting the published port directly.
# This vhost exists for the mobile app and for browser/manual access, and so
# that a cert can be dropped on the API later without re-plumbing anything.

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name nbjclapi.punrasargroup.com;

    access_log /var/log/nginx/nbjclapi.access.log;
    error_log  /var/log/nginx/nbjclapi.error.log;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Payroll and report endpoints are slow; the 60s default cuts them off.
        proxy_read_timeout 300s;
    }
}
