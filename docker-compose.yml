services:
  nbclerp-backend:
    # No build: stanza on purpose. Only docker-compose.yml is scp'd to the VPS,
    # so a build fallback there can only fail with a confusing "no such file:
    # Dockerfile". CI builds and pushes; the VPS pulls.
    image: ghcr.io/tarunsadhukhan/nbclerp3be:latest
    container_name: nbclerp-backend
    restart: unless-stopped
    # Host 8001 -> container 8000, so nginx for nbclapi.infoskyglobalit.in
    # proxies to :8001. The container still listens on 8000 internally, which
    # is what NEXT_PUBLIC_BACKENDHOST=http://nbclerp-backend:8000 targets.
    ports:
      - "8001:8000"
    # .env lives on the VPS at /opt/nbjcl/nbclerp3be/.env and is NOT in git.
    # The app calls load_dotenv("env/database.env"), but those vars are already
    # in the container environment from here, so os.getenv() finds them anyway.
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
    networks:
      - nbclerp

  # Same image, different command. The bio-attendance pipeline must run in its
  # own process (see src/scheduler_main.py) or it never fires.
  nbclerp-scheduler:
    image: ghcr.io/tarunsadhukhan/nbclerp3be:latest
    container_name: nbclerp-scheduler
    restart: unless-stopped
    command: uvicorn src.scheduler_main:app --host 0.0.0.0 --port 48480
    # No `ports:` on purpose. Nothing outside the compose network calls this
    # service, and publishing 48480 on the host made every deploy die with
    # "Bind for 0.0.0.0:48480 failed: port is already allocated" once a stray
    # container held it. It still listens on 48480 inside the nbclerp network.
    # Health check from the VPS (python:3.12-slim has no curl):
    #   docker exec nbclerp-scheduler python -c \
    #     "import urllib.request;print(urllib.request.urlopen('http://localhost:48480/health').read().decode())"
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
    networks:
      - nbclerp

networks:
  nbclerp:
    external: true
